name: Pull World Cup results

on:
  schedule:
    - cron: '*/10 * * * *'   # every ~10 minutes (free on public repos)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch results and cache to Firebase
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-results.mjs
